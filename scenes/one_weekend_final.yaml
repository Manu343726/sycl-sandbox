name: "One Weekend — Random Spheres"
kernel: raytracer
scene_type: 3d

# ── Scene parameters ──────────────────────────────────────────────────
# Only kernel-specific params are declared here.  Standard render params
# (spp_frame, max_bounces) and 3D camera params (cam_eye, cam_at, cam_fov,
# cam_aperture, cam_up) are auto-generated by the scene descriptor loader.
#
# Kernel-specific params can be referenced in data_sources and objects
# via the $name syntax.
params:
  num_spheres:
    type: int
    description: "Number of random small spheres scattered on the ground"
    default: 22
    range: [0, 500]
  ground_color:
    type: color
    description: "Albedo colour of the large ground sphere"
    default: [0.5, 0.5, 0.5]
  background:
    type: color
    description: "Sky colour (used in gradient background)"
    default: [0.5, 0.7, 1.0]

# ── Kernel statistics ────────────────────────────────────────────────
statistics:
  num_objects:
    type: int
    description: "Number of scene objects (handles)"
    viz: text
  num_bvh_nodes:
    type: int
    description: "BVH node count"
    viz: text
  num_lights:
    type: int
    description: "Number of light sources"
    viz: text

# ── Data sources ─────────────────────────────────────────────────────
# Procedural value generators with typed inputs.  Inputs can reference
# params ($name) or other data sources ($other), enabling recursive
# value generation.
data_sources:
  - id: positions
    type: vec3[]
    description: "Random positions for small spheres"
    generator: random_range
    inputs:
      count: $num_spheres
      min: [-10, 0.2, -10]
      max: [10, 0.2, 10]

  - id: colors
    type: vec3[]
    description: "Random albedo colours for small spheres"
    generator: random_range
    inputs:
      count: $num_spheres
      min: [0, 0, 0]
      max: [1, 1, 1]

  - id: material_choice
    type: string[]
    description: "Random material type for each small sphere"
    generator: weighted_choice
    inputs:
      count: $num_spheres
      choices:
        - value: lambertian
          weight: 0.6
        - value: metal
          weight: 0.25
        - value: dielectric
          weight: 0.15

  - id: fuzz
    type: float[]
    description: "Random fuzz factor for metal spheres"
    generator: random_range
    inputs:
      count: $num_spheres
      min: 0.0
      max: 0.5

# ── Scene objects ────────────────────────────────────────────────────
# Declarative scene geometry.  Object properties can reference scene
# params ($name) or data sources ($data_source) for per-instance values.
objects:
  # Ground sphere: large lambertian sphere
  - type: sphere
    center: [0, -1000, 0]
    radius: 1000
    material:
      type: lambertian
      albedo: $ground_color

  # Three large decorative spheres at fixed positions
  - type: sphere
    center: [4, 1, 0]
    radius: 1
    material:
      type: metal
      albedo: [0.7, 0.6, 0.5]
      fuzz: 0.0

  - type: sphere
    center: [-4, 1, 0]
    radius: 1
    material:
      type: lambertian
      albedo: [0.4, 0.2, 0.1]

  - type: sphere
    center: [0, 1, 0]
    radius: 1
    material:
      type: dielectric
      ir: 1.5

  # Random small spheres: generated from data sources with per-instance
  # material dispatch.
  - count: $num_spheres
    hittable:
      type: sphere
      radius: 0.2
      center: $positions
    material:
      source: $material_choice
      mapping:
        lambertian:
          type: lambertian
          albedo: $colors
        metal:
          type: metal
          albedo: $colors
          fuzz: $fuzz
        dielectric:
          type: dielectric
          ir: 1.5
