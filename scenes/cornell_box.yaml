name: "Cornell Box"
kernel: raytracer
scene_type: 3d

# ── Scene parameters ──────────────────────────────────────────────────
# Only kernel-specific params are declared here.  Standard render params
# (spp_frame, max_bounces) and 3D camera params (cam_eye, cam_at, cam_fov,
# etc.) are auto-generated by the scene descriptor loader.
#
# Standard params may also be given a scene default: declaring a param
# name that matches an auto-generated one overrides its default value.
# The tone mapper is off by default; HDR raytracing scenes opt in here.
params:
  background:
    type: color
    description: "Background colour (ignored in enclosed box)"
    default: [0.0, 0.0, 0.0]
  light_color:
    type: color
    description: "Ceiling light colour (base tint, 0-1)"
    default: [1.0, 1.0, 1.0]
  light_intensity:
    type: float
    description: "Ceiling light intensity multiplier"
    default: 15.0
    range: [0, 50]
  tonemap_enabled:
    type: bool
    description: "Enable the tone-mapping stage (Reinhard + gamma by default)"
    default: true

# ── Kernel statistics ────────────────────────────────────────────────
# Kernel-output values displayed in the UI.  Standard stats (FPS, frame time,
# SPP, pixel count, memory) are auto-generated.
statistics:
  num_objects:
    type: int
    description: "Number of scene objects (handles)"
    viz: text
  num_bvh_nodes:
    type: int
    description: "BVH node count"
    viz: text
  num_lights:
    type: int
    description: "Number of light sources"
    viz: text

# ── Scene geometry ───────────────────────────────────────────────────
# Fully declared in YAML — no hardcoded geometry in the kernel.
objects:
  # Floor  (Y=0)
  - type: quad
    base: [-2, 0, -2]
    u: [4, 0, 0]
    v: [0, 0, 4]
    material:
      type: lambertian
      albedo: [0.73, 0.73, 0.73]

  # Ceiling  (Y=3)
  - type: quad
    base: [-2, 3, -2]
    u: [4, 0, 0]
    v: [0, 0, 4]
    material:
      type: lambertian
      albedo: [0.73, 0.73, 0.73]

  # Back wall  (Z=-2)
  - type: quad
    base: [-2, 0, -2]
    u: [4, 0, 0]
    v: [0, 3, 0]
    material:
      type: lambertian
      albedo: [0.73, 0.73, 0.73]

  # Left wall  (X=-2, red)
  - type: quad
    base: [-2, 0, -2]
    u: [0, 3, 0]
    v: [0, 0, 4]
    material:
      type: lambertian
      albedo: [0.65, 0.05, 0.05]

  # Right wall  (X=2, green)
  - type: quad
    base: [2, 0, -2]
    u: [0, 3, 0]
    v: [0, 0, 4]
    material:
      type: lambertian
      albedo: [0.12, 0.45, 0.15]

  # Light panel on ceiling
  - type: quad
    base: [-1, 2.99, -1]
    u: [2, 0, 0]
    v: [0, 0, 2]
    material:
      type: diffuse_light
      emit: $light_color
      intensity: $light_intensity

  # Short box (left)
  - type: box
    box_min: [-0.8, 0.0, -0.8]
    box_max: [-0.2, 1.5, -0.2]
    material:
      type: lambertian
      albedo: [0.55, 0.55, 0.55]

  # Tall box (right)
  - type: box
    box_min: [0.8, 0.0, -0.3]
    box_max: [1.4, 0.6, 0.9]
    material:
      type: lambertian
      albedo: [0.55, 0.55, 0.55]
