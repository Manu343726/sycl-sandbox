name: "Mandelbrot Fractal"
kernel: mandelbrot
scene_type: 2d

# ── Scene parameters ──────────────────────────────────────────────────
# Only kernel-specific params are declared here.  Standard render params
# (spp_frame) and 2D camera params (center_x, center_y, zoom) are
# auto-generated by the scene descriptor loader.
params:
  max_iterations:
    type: int
    description: "Maximum iterations per point (higher = more detail but slower)"
    default: 500
    range: [10, 10000]

# ── Kernel statistics ────────────────────────────────────────────────
statistics:
  max_iterations:
    type: int
    description: "Configured maximum iteration count"
    viz: text
  zoom_level:
    type: float
    description: "Current zoom level"
    viz: text
    range: [0, 1000]
