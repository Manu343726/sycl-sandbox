name: "ColorChecker Floor"
kernel: raytracer
scene_type: 3d

# ── Scene parameters ──────────────────────────────────────────────────
# Only kernel-specific params are declared here.  Standard render params
# (spp_frame, max_bounces) and 3D camera params (cam_eye, cam_at, cam_fov,
# cam_aperture, cam_up) are auto-generated by the scene descriptor loader.
#
# Demo scene for the procedural ColorChecker texture: a floor quad whose
# textured_lambertian material samples the chart.  The chart is an
# infinite tiling — UV overflow just continues with another chart.
params:
  background:
    type: color
    description: "Background colour"
    default: [0.05, 0.05, 0.1]

# ── Kernel statistics ────────────────────────────────────────────────
statistics:
  num_objects:
    type: int
    description: "Number of scene objects (handles)"
    viz: text
  num_bvh_nodes:
    type: int
    description: "BVH node count"
    viz: text
  num_lights:
    type: int
    description: "Number of light sources"
    viz: text

# ── Objects ──────────────────────────────────────────────────────────
# Floor plane: a quad 4×4 units centered below the camera, textured with
# the ColorChecker chart (1 full chart per UV unit).
objects:
  - type: quad
    center: [0, 0, 0]
    u: [4, 0, 0]
    v: [0, 0, 4]
    material:
      type: textured_lambertian
      texture: colorchecker
      scale_u: 1.0
      scale_v: 1.0

# ── Lights ───────────────────────────────────────────────────────────
# Emissive sphere above the floor, illuminating the chart.
lights:
  - center: [0, 3, 0]
    color: [1, 1, 1]
    intensity: 2.0
