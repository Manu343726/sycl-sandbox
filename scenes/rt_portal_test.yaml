name: "RT Portal Test — Hardcoded Scene"
kernel: rt_portal_test
scene_type: 3d

# ── Scene parameters ──────────────────────────────────────────────────
# Only kernel-specific params are declared here.  Standard render params
# (spp_frame, max_bounces) and 3D camera params (cam_eye, cam_at, cam_fov,
# cam_aperture, cam_up) are auto-generated by the scene descriptor loader.
#
# Diagnostic scene: the kernel IGNORES the scene system and builds a
# hardcoded single-room scene — the Cornell box with a bidirectional
# sphere-sphere portal floating inside it (no second room).  A ray
# hitting either sphere teleports to the other (same UVs, direction
# kept), so each sphere shows the room behind the other.  This YAML only
# supplies params/stats scaffolding so the scene is selectable and the
# kernel ABI works.
#
# Tone mapping is enabled by default so this scene matches the look of
# the YAML scenes (which also opt in via YAML).
params:
  background:
    type: color
    description: "Background colour (ignored in enclosed rooms)"
    default: [0.0, 0.0, 0.0]
  tonemap_enabled:
    type: bool
    description: "Enable the tone-mapping stage (Reinhard + gamma by default)"
    default: true

# ── Kernel statistics ────────────────────────────────────────────────
statistics:
  num_objects:
    type: int
    description: "Number of scene objects (handles)"
    viz: text
  num_bvh_nodes:
    type: int
    description: "BVH node count"
    viz: text
  num_lights:
    type: int
    description: "Number of light sources"
    viz: text
